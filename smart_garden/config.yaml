name: Smart Garden
version: "1.0.0"
slug: smart_garden
description: Smart irrigation - zones, schedules, weather- and soil-aware watering, ESPHome relay boards, Zigbee sensors, lawn and plant care.
url: https://github.com/sharjeelkiyani/smart-garden-ha
arch:
  - aarch64
  - amd64
image: ghcr.io/sharjeelkiyani/smart-garden-addon
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:sprinkler-variant
panel_title: Garden
services:
  - mqtt:want
options:
  ha_users_are_admins: true
  zone_count: 8
  zigbee2mqtt_base_topic: zigbee2mqtt
schema:
  ha_users_are_admins: bool
  zone_count: int(1,8)
  esphome_url: url?
  esphome_entity_pattern: str?
  zigbee2mqtt_base_topic: str
  timezone: str?
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Optional direct access (not needed - use the Garden panel in the sidebar)
